name: CI Pipeline

# CI (lint + test + build) รันทุกครั้งที่ push หรือเปิด PR เข้า main/master/develop
# ส่วน CD (push image ขึ้น Docker Hub + deploy ขึ้น VPS) แยกไปอยู่ที่ .github/workflows/cd.yml แล้ว
# (เดิมมี job push ซ้ำอยู่ทั้งสองไฟล์ ทำให้ทุกครั้งที่ merge เข้า main จะ push image ขึ้น Docker Hub 2 รอบซ้อนกัน — เอาออกจากไฟล์นี้แล้ว)
on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

# ยกเลิก run เก่าของ branch เดียวกันถ้ามีการ push ใหม่เข้ามาทับ ประหยัดเวลา CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # CI: Lint
  # -------------------------------------------------------------------------
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

  # -------------------------------------------------------------------------
  # CI: Unit Tests
  # -------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run unit tests
        working-directory: ./backend
        run: npm test
        env:
          # ไม่ต้องมี PostgreSQL จริงใน CI — tests mock pool.query() ทั้งหมด (ดู backend/tests/api.test.js)
          NODE_ENV: test

  # -------------------------------------------------------------------------
  # CI: Build Docker images (validate Dockerfiles compile, ไม่ push)
  # รันทั้งตอน push และ pull_request เพื่อดักปัญหา Dockerfile พังก่อน merge
  # -------------------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: notebook-shop-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: notebook-shop-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
